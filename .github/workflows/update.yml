name: update-data

# Cloud updater (primary). Fetches Fear & Greed + VOO/TQQQ and commits
# docs/data.json so GitHub Pages serves fresh data — no PC required.
# If CNN blocks GitHub's datacenter IP, the fetch keeps the previous data
# (the collector degrades gracefully) and the local PC task acts as fallback.

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily (US morning)
    - cron: "0 21 * * *"   # 21:00 UTC daily (US afternoon)
  workflow_dispatch:        # allow manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect data
        run: node collector/fetch.mjs || true   # exit 2 = partial (kept previous); don't fail the job

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: update (actions) $(date -u +%FT%TZ)"
            git pull --rebase --autostash || true
            git push
          fi
